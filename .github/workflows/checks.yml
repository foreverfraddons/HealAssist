name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 lua5.3 > /dev/null
      - name: Patch notes
        run: python3 tools/changelog.py check
      - name: Syntax (Lua 5.1, like the game)
        run: for f in HealAssist/*.lua; do luac5.1 -p "$f" || exit 1; done
      - name: Built-in tool tests (as inside Command Center)
        run: |
          lua5.3 tests/ha_test.lua HealAssist/HealAssist.lua
          HA_REFUSE=1 lua5.3 tests/ha_test.lua HealAssist/HealAssist.lua
      - name: Standalone tests
        run: lua5.3 tests/standalone_test.lua HealAssist
